[env]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr
platform_packages = platformio/framework-zephyr@~3.40200.0
monitor_speed = 115200

[env:placa1]
build_flags = -DPLACA1

[env:placa2]
build_flags = -DPLACA2


platform_packages = platformio/framework-zephyr@~3.40200.0